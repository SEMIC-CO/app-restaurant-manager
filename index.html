<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestoBar Manager</title>
    <script>
      // Anti-FOUC: aplica el tema ANTES de que React renderice (evita flash blanco/negro)
      (function () {
        try {
          var stored = localStorage.getItem('app-theme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script>
      // Preflight de versión: se ejecuta ANTES del módulo principal. Si el
      // servidor/CDN entrega un index.html viejo, su JS ya no existe y el
      // navegador recibe HTML con Content-Type text/html. Como main.tsx no
      // llega a cargar, la recuperación tiene que estar aquí.
      (function () {
        var build = '__APP_VERSION_INLINE__';
        if (!build || build.charAt(0) === '_') return;
        fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (resp) { return resp.ok ? resp.json() : null; })
          .then(function (data) {
            if (!data || !data.version || data.version === build) return;
            try {
              if (sessionStorage.getItem('app-version-reload') === data.version) return;
              sessionStorage.setItem('app-version-reload', data.version);
            } catch (e) {}
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) { reg.unregister(); });
              }).catch(function () {});
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (key) { caches.delete(key); });
              }).catch(function () {});
            }
            location.replace(location.pathname + '?v=' + encodeURIComponent(data.version) + location.hash);
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
